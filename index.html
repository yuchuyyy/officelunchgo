<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>團購點餐彙整</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--card:#fff;--bd:#ddd;--ac:#d9480f;--mu:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#eee;--card:#262625;--bd:#444;--ac:#ff922b;--mu:#aaa}}
:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#eee;--card:#262625;--bd:#444;--ac:#ff922b;--mu:#aaa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Noto Sans TC","PingFang TC",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:14px 0}
textarea{width:100%;height:210px;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.wrap{overflow-x:auto}.mu{color:var(--mu);font-size:.85rem}.warn{color:#e03131;font-size:.9rem}
.r{text-align:right}pre{white-space:pre-wrap;margin:0;font:inherit}
input[type=number]{width:84px;box-sizing:border-box;font:inherit;padding:4px 6px;text-align:right;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}input.bad{border-color:#e03131}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>🍜 團購點餐彙整</h1>
<p class="mu">每行一人，格式「姓名：品項價格，品項x數量」。貼上後自動彙整。</p>
<div class="card"><textarea id="in">雪：軟骨麵線（乾）70
茜：紅燒軟骨湯麵+燙青菜100
和：軟骨麵線（乾）70
慧：軟骨麵線（乾）70
蘭：軟骨飯x 4(280)，乾的豬腳麵線×1(70)</textarea></div>
<div class="card"><h2>給店家的訂單</h2><pre id="out"></pre><button id="cp">複製訂單</button> <span id="ok" class="mu"></span></div>
<div class="card"><h2>品項明細（單價可直接修改）</h2><div class="wrap"><table id="t1"></table></div></div>
<div class="card"><h2>每人金額（收錢用）</h2><div class="wrap"><table id="t2"></table></div><div id="warn" class="warn"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(n){
  n=n.replace(/\s+/g,'').replace(/\(/g,'（').replace(/\)/g,'）');
  return n.replace(/^(.*?[^（）])([大小中])$/,'$1（$2）');
}
const SZ=/（[大中小]）/;
const base=n=>n.replace(/（[^）]*）/g,'');
const RE=/^(.*?)\s*(?:[xX×*✕]\s*(\d+))?\s*(?:[（(]\s*(\d+)\s*元?\s*[）)]|(\d+)\s*元?)?\s*$/;
let people=[],agg={},names=[],ov={};
function parse(text){
  const out=[];
  text.split(/\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    const m=line.match(/^([^：:]+)[：:](.*)$/); if(!m) return;
    let rest=m[2],total=null;
    const tm=rest.match(/共\s*(\d+)\s*元?/);
    if(tm){total=+tm[1];rest=rest.replace(tm[0],'');}
    const items=[];
    rest.split(/[，,、；;。]/).forEach(s=>{
      s=s.trim(); if(!s) return;
      const p=s.match(RE); if(!p||!p[1]) return;
      const qty=+(p[2]||1);
      const price=p[3]?(+p[3])/qty:(p[4]?+p[4]:null);
      // 「+」拆成多個品項；整組價格記在第一項，其餘讓點餐的人自己填
      const parts=p[1].split(/[+＋]/).map(x=>x.trim()).filter(Boolean);
      parts.forEach((nm,idx)=>
        items.push({name:norm(nm),qty,price:idx===0?price:null,inferred:false,combo:parts.length>1?parts.join('+'):null}));
    });
    out.push({who:m[1].trim(),items,total});
  });
  return out;
}
function resolve(ps){
  const known={},kb={};
  ps.forEach(p=>p.items.forEach(i=>{if(i.price!=null){known[i.name]=i.price;if(!SZ.test(i.name)&&!(base(i.name) in kb))kb[base(i.name)]=i.price;}}));
  ps.forEach(p=>{
    p.items.forEach(i=>{
      if(i.price==null){
        if(i.name in known)i.price=known[i.name];
        else if(!SZ.test(i.name)&&base(i.name) in kb){i.price=kb[base(i.name)];i.inferred=true;}
      }
    });
    const unk=p.items.filter(i=>i.price==null);
    if(unk.length===1&&p.total!=null){
      const sum=p.items.filter(i=>i.price!=null).reduce((a,i)=>a+i.price*i.qty,0);
      const u=(p.total-sum)/unk[0].qty;
      if(u>0&&Number.isInteger(u)){unk[0].price=u;unk[0].inferred=true;}
    }
  });
}
const eff=k=>k in ov?ov[k]:(agg[k].price??null);
const pr=(i)=>i.name in ov?ov[i.name]:i.price;
function render(){
  people=parse($('in').value); resolve(people); agg={};
  people.forEach(p=>p.items.forEach(i=>{
    const a=agg[i.name]||(agg[i.name]={qty:0,price:null,prices:new Set(),who:[],inf:false,combo:null});
    if(i.combo)a.combo=i.combo;
    a.qty+=i.qty; if(a.price==null)a.price=i.price; if(i.price!=null)a.prices.add(i.price); if(i.inferred)a.inf=true;
    a.who.push(p.who+(i.qty>1?'×'+i.qty:''));
  }));
  names=Object.keys(agg);
  $('t1').innerHTML='<tr><th>品項</th><th class="r">數量</th><th class="r">單價</th><th class="r">小計</th><th>誰點的</th></tr>'+
    names.map((k,x)=>{const a=agg[k],v=eff(k);
      
      return `<tr><td>${esc(k)}<div id="f${x}"></div></td><td class="r">${a.qty}</td><td class="r"><input type="number" min="0" inputmode="decimal" data-x="${x}" value="${v??''}" placeholder="填價格"></td><td class="r" id="s${x}"></td><td class="mu">${esc(a.who.join('、'))}</td></tr>`}).join('')+
    '<tr><th>合計</th><th class="r" id="tq"></th><th></th><th class="r" id="ts"></th><th></th></tr>';
  document.querySelectorAll('#t1 input').forEach(el=>el.oninput=()=>{
    const k=names[+el.dataset.x];
    if(el.value==='')delete ov[k]; else ov[k]=+el.value;
    if(el.value===''&&agg[k].price!=null){} 
    recalc();
  });
  recalc();
}
function flagHtml(k){
  const a=agg[k],h=[];
  if(a.combo)h.push(k in ov?'<div class="mu">組合品項，已手動填價</div>':'<div class="warn">⚠ 請確認價格</div>');
  if(SZ.test(k)&&eff(k)==null)h.push('<div class="warn">⚠ 大小價格不同，請確認價格</div>');
  if(a.prices.size>1)h.push('<div class="warn">各人填的價格不同，請確認</div>');
  if(a.inf&&!(k in ov))h.push('<div class="mu">推算價格</div>');
  return h.join('');
}
function recalc(){
  let n=0,sum=0,miss=[];
  names.forEach((k,x)=>{
    const a=agg[k],v=eff(k); n+=a.qty;
    if(v==null)miss.push(k);
    $('f'+x).innerHTML=flagHtml(k);
    $('s'+x).textContent=v!=null?v*a.qty:'?'; sum+=(v||0)*a.qty;
  });
  $('tq').textContent=n; $('ts').textContent=sum;
  document.querySelectorAll('#t1 input').forEach(el=>el.classList.toggle('bad',el.value===''));
  $('out').textContent=names.map(k=>k+' x'+agg[k].qty).join('\n')+(names.length?`\n\n共 ${n} 份，${sum} 元`:'');
  const warns=[];
  $('t2').innerHTML='<tr><th>姓名</th><th>品項</th><th class="r">金額</th></tr>'+people.map(p=>{
    let amt=0,m=false;
    p.items.forEach(i=>{const v=pr(i);if(v==null)m=true;amt+=(v||0)*i.qty;});
    if(p.total!=null&&!m&&p.total!==amt)warns.push(`${p.who} 自報 ${p.total} 元，但計算為 ${amt} 元`);
    return `<tr><td>${esc(p.who)}</td><td class="mu">${esc(p.items.map(i=>i.name+(i.qty>1?'×'+i.qty:'')).join('、'))}</td><td class="r">${m?'?':amt}${p.items.some(i=>i.combo&&!(i.name in ov))?' ⚠':''}</td></tr>`}).join('');
  const cb=names.filter(k=>agg[k].combo&&!(k in ov));
  if(cb.length)warns.unshift('⚠ 請確認價格：'+cb.join('、'));
  if(miss.length)warns.unshift('尚未填價格：'+miss.join('、'));
  $('warn').innerHTML=warns.map(esc).join('<br>');
}
$('in').addEventListener('input',render);
$('cp').onclick=async()=>{
  try{await navigator.clipboard.writeText($('out').textContent);$('ok').textContent='已複製 ✓';}
  catch(e){const r=document.createRange();r.selectNodeContents($('out'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('ok').textContent='請手動複製';}
};
render();
</script>
</body>
</html>
